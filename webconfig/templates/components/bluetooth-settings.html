<div id="section-bluetooth" class="settings-card bg-zinc-900/50 backdrop-blur-xs border border-zinc-700 p-4 rounded-lg shadow-lg mb-4 collapsible-section">
    <h3 class="flex items-center gap-2 cursor-pointer group text-lg grow justify-between mb-4 text-slate-200 hover:text-emerald-400 transition-colors">
        <span class="material-icons">bluetooth</span>
        Bluetooth
        <span class="material-icons transition-transform duration-200 ml-2">expand_more</span>
    </h3>
    <div id="bluetooth-settings" data-token="{{ bluetooth_token }}" class="space-y-4">
        <p id="bt-setup" role="status" aria-live="polite">Checking Bluetooth installation…</p>
        <button type="button" id="bt-setup-retry" data-action="setup-retry" class="secondary-action secondary-action--hover--cyan h-11 px-3" hidden>
            <span class="material-icons text-base" aria-hidden="true">refresh</span>
            Retry Bluetooth setup
        </button>
        <p id="bt-audio" role="status" aria-live="polite" class="text-slate-400">Checking Bluetooth…</p>
        <h2 id="bt-devices-title" class="text-lg font-semibold" hidden>Devices</h2>
        <ul id="bt-devices" class="space-y-3"></ul>
        <p id="bt-pair-hint" hidden>Select Billy Bass in your device’s Bluetooth settings, then confirm the request here.</p>
        <div class="flex flex-wrap gap-3">
            <button type="button" data-action="pair" id="bt-pair" class="secondary-action secondary-action--hover--cyan h-11 px-3">
                <span class="material-icons text-base" aria-hidden="true">bluetooth_searching</span>
                Pair new device
            </button>
            <button type="button" id="bt-pair-stop" data-action="pair-stop" class="secondary-action secondary-action--hover--amber h-11 px-3" hidden>
                <span class="material-icons text-base" aria-hidden="true">close</span>
                Stop pairing
            </button>
        </div>
        <div id="bt-pending" hidden class="border border-emerald-500 rounded-lg p-3 space-y-3">
            <p id="bt-request"></p>
            <button type="button" id="bt-accept" class="secondary-action secondary-action--hover--emerald h-11 px-3">
                <span class="material-icons text-base" aria-hidden="true">check</span>
                Accept
            </button>
            <button type="button" id="bt-reject" class="secondary-action secondary-action--hover--rose h-11 px-3">
                <span class="material-icons text-base" aria-hidden="true">close</span>
                Reject
            </button>
        </div>
        <p id="bt-error" role="alert" class="text-rose-400"></p>
    </div>
</div>
