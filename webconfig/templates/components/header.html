<!-- 🐟 Billy Header with Controls & Log Buttons -->
<header class="z-30 sticky top-0 backdrop-blur-sm shadow-[0_4px_10px_rgba(0,0,0,0.25)]">
    <div class="px-4 py-2">
    <div class="flex flex-row flex-wrap items-center relative justify-end gap-2 pl-20">
        <div class="flex gap-2 flex-col md:flex-row items-center absolute left-0 group mr-2">
            <img id="status-logo" src="/static/images/status-inactive.png"
                 alt="Billy status"
                 class="w-16 h-16 select-none group-hover:blur-xs transition-all" draggable="false">
            <span id="service-status" class="text-sm flex opacity-0 group-hover:opacity-100 absolute h-full w-full items-center content-center transition-all">(inactive)</span>
        </div>

        <!-- Power button and dropdown (moved to left) -->
        <div class="flex items-center">
            <div class="relative inline-block">
                <!-- Main power button -->
                <button id="power-btn"
                        class="secondary-action secondary-action--hover--rose text-sm p-2 cursor-pointer"
                        title="Power options">
                    <span class="material-icons">power_settings_new</span>
                </button>

                <!-- Dropdown -->
                <div id="power-dropdown"
                     class="absolute left-0 mt-2 hidden z-30">
                    <button id="stop-billy-btn"
                            class="hidden w-full items-center justify-start gap-2 rounded-xl px-3 py-2 text-sm text-white transition-all secondary-action secondary-action--hover--rose">
                        <span class="material-icons text-rose-400">stop</span>
                        Stop
                    </button>
                    <button id="reboot-billy-btn"
                            class="w-full flex items-center justify-start gap-2 rounded-xl px-3 py-2 text-sm text-white transition-all secondary-action secondary-action--hover--amber">
                        <span class="material-icons text-amber-400">restart_alt</span>
                        Reboot
                    </button>
                    <button id="shutdown-billy-btn"
                            class="w-full flex items-center justify-start gap-2 rounded-xl px-3 py-2 text-sm text-white transition-all secondary-action secondary-action--hover--rose">
                        <span class="material-icons text-rose-400">power_off</span>
                        Shutdown
                    </button>
                </div>
            </div>
        </div>

        <div id="service-controls" class="flex gap-2 grow">
            <!-- Service buttons inserted via JS -->
        </div>

        <button id="toggle-log-btn"
                class="secondary-action secondary-action--hover--cyan text-sm p-2 cursor-pointer"
                title="Show debug log">
            <span class="material-icons bug_report">bug_report</span>
            <span class="text-xs hidden md:block">Debug</span>
        </button>

        <div class="flex flex-wrap items-center gap-4">
            <a href="/settings"
               id="header-settings-btn"
               data-page-link
               data-page="settings"
               class="secondary-action secondary-action--hover--emerald text-sm p-2 border border-transparent cursor-pointer relative"
               title="Settings">
                <span class="material-icons">settings</span>
                <span class="text-xs hidden md:block">Settings</span>
                <span data-release-badge
                      class="hidden absolute -top-2 -right-2 items-center justify-center w-5 h-5 rounded-full bg-amber-500 text-black text-xs font-extrabold shadow">
                      !
                </span>
            </a>
        </div>
    </div>
    </div>

    <section id="log-panel" class="hidden px-4 pb-4">
        <div class="p-3 bg-zinc-900/88 backdrop-blur-sm border border-zinc-600 flex gap-3 justify-between items-center flex-wrap shadow-2xl">
            <div class="flex items-center gap-3 flex-wrap">
                <div class="flex flex-col items-start gap-2">
                    <div class="flex items-center gap-2">
                        <label for="log-level-select" class="text-sm text-gray-200">
                            Log Level:
                        </label>
                        <span class="material-icons text-zinc-300 cursor-pointer"
                              onclick="toggleTooltip(this)"
                              title="Log level help">help_outline</span>
                        <div data-tooltip class="log-level-tooltip-inline gap-3">
                            <div class="flex items-center gap-2">
                                <span class="material-icons text-red-400 text-sm mt-0.5">error</span>
                                <p><strong>Error:</strong> Only critical failures.</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="material-icons text-yellow-400 text-sm mt-0.5">warning</span>
                                <p><strong>Warning:</strong> Adds recoverable issues.</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="material-icons text-blue-400 text-sm mt-0.5">info</span>
                                <p><strong>Info:</strong> Adds normal operations.</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="material-icons text-purple-400 text-sm mt-0.5">search</span>
                                <p><strong>Verbose:</strong> Adds debug details.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <select id="log-level-select"
                        class="bg-zinc-700 text-white text-sm px-3 py-1 rounded border border-zinc-600 focus:border-cyan-500 focus:outline-none">
                    <option value="ERROR">Error</option>
                    <option value="WARNING">Warning</option>
                    <option value="INFO" selected>Info</option>
                    <option value="VERBOSE">Verbose</option>
                </select>
                <button id="apply-log-level-btn"
                        class="secondary-action secondary-action--hover--cyan text-sm py-1 px-3 shadow">
                    Apply
                </button>
            </div>
            <button id="clear-logs-btn"
                    class="secondary-action secondary-action--hover--rose text-sm py-1 px-3 shadow">
                Clear log
            </button>
        </div>
        <div id="log-container"
             class="relative mt-3 rounded-lg px-2 max-h-96 overflow-y-scroll text-sm transition-all duration-300 border border-cyan-500 bg-zinc-900/88 backdrop-blur-sm shadow-2xl">
            <button id="toggle-fullscreen-btn"
                    class="sticky top-2 left-full mr-3 bg-zinc-800 hover:bg-zinc-700 text-white px-2 py-1 rounded z-10 shadow flex items-center justify-center"
                    title="Toggle Fullscreen Log">
                <span class="material-icons" id="fullscreen-icon">fullscreen</span>
            </button>

            <pre id="log-output"
                 class="text-cyan-500 whitespace-pre-wrap break-words overflow-x-hidden max-w-full">Loading logs…</pre>

            <button id="scroll-bottom-btn"
                    title="Auto-scroll"
                    class="sticky bottom-2 left-full mr-3 ml-auto bg-zinc-800 hover:bg-zinc-700 text-white px-2 py-1 rounded z-10 shadow flex items-center justify-center cursor-pointer">
                <span class="material-icons">arrow_downward</span>
            </button>
        </div>
    </section>

</header>
