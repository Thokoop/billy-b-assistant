<!-- Password Change Modal -->
<div id="password-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-zinc-900/50 backdrop-blur-xs border border-zinc-700 rounded-lg shadow-2xl p-6 w-full max-w-md mx-4">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg text-white">Change Raspberry Pi Admin Password</h3>
            <button id="close-password-modal" class="text-zinc-400 hover:text-white">
                <span class="material-icons">close</span>
            </button>
        </div>
        <p class="text-sm text-zinc-400 mb-4">
            For security, please change the default password for the Raspberry Pi admin with username: billy.<br>
        </p>
        <form id="password-form">
            <div class="mb-4">
                <label for="new-password" class="block text-sm text-zinc-300">
                    New Password
                </label>
                <input type="password" id="new-password" name="new_password" required minlength="8"
                       class="field mt-1">
            </div>
            <div class="mb-4">
                <label for="confirm-password" class="block text-sm text-zinc-300">
                    Confirm New Password
                </label>
                <input type="password" id="confirm-password" name="confirm_password" required minlength="8"
                       class="field mt-1">
            </div>
            <div class="mb-6 text-sm">
                <strong class="text-amber-400">Important:</strong> Remember this password and the username 'billy' in case you'll need to access your Pi via SSH.
            </div>
            <div class="flex justify-center">
                <button type="submit"
                        class="primary-action bg-emerald-600 text-white w-full">
                    Change Password
                </button>
            </div>
        </form>
    </div>
</div>
