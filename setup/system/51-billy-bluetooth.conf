# Dedicated Raspberry Pi OS Lite audio setup: Billy owns the physical ALSA devices.
wireplumber.profiles = {
  main = {
    monitor.alsa = disabled
    monitor.bluez.seat-monitoring = disabled
  }
}
monitor.bluez.properties = {
  # Role names describe the LOCAL machine: Billy is the A2DP sink and the HFP
  # hands-free unit, so the phone streams media to Billy and Billy acts as the
  # headset for calls. Verified on hardware: [ a2dp_source ] makes the adapter
  # advertise Audio Source (0x110a) instead of Audio Sink (0x110b).
  bluez5.roles = [ a2dp_sink hfp_hf ]
  bluez5.hfphsp-backend = native
  bluez5.enable-msbc = true
}
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = {
      update-props = {
        bluez5.media-source-role = input
      }
    }
  }
]
